<?xml version='1.0'?>
<!DOCTYPE fontconfig SYSTEM 'fonts.dtd'>
<fontconfig>
 <match target="font">
  <edit mode="assign" name="rgba">
   <const>rgb</const>
  </edit>
 </match>
 <match target="font">
  <edit mode="assign" name="hinting">
   <bool>false</bool>
  </edit>
 </match>
 <match target="font">
  <edit mode="assign" name="hintstyle">
   <const>hintnone</const>
  </edit>
 </match>
 <!-- Map fonts that are commonly used by web pages to our preferred fonts -->
 <match target="pattern">
  <test name="family" qual="any">
   <string>Arial</string>
  </test>
  <edit binding="same" mode="assign" name="family">
   <string>sans-serif</string>
  </edit>
 </match>
 <match target="pattern">
  <test name="family" qual="any">
   <string>Liberation Sans</string>
  </test>
  <edit binding="same" mode="assign" name="family">
   <string>sans-serif</string>
  </edit>
 </match>
 <match target="pattern">
  <test name="family" qual="any">
   <string>Liberation Mono</string>
  </test>
  <edit binding="same" mode="assign" name="family">
   <string>monospace</string>
  </edit>
 </match>
 <!-- Intercept Windows & macOS fonts frequently abused by web CSS and redirect them -->
 <match target="pattern">
  <test name="family" qual="any">
   <string>Microsoft YaHei</string>
  </test>
  <edit binding="same" mode="assign" name="family">
   <string>sans-serif</string>
  </edit>
 </match>
 <match target="pattern">
  <test name="family" qual="any">
   <string>微软雅黑</string>
  </test>
  <edit binding="same" mode="assign" name="family">
   <string>sans-serif</string>
  </edit>
 </match>
 <match target="pattern">
  <test name="family" qual="any">
   <string>Microsoft YaHei UI</string>
  </test>
  <edit binding="same" mode="assign" name="family">
   <string>sans-serif</string>
  </edit>
 </match>
 <match target="pattern">
  <test name="family" qual="any">
   <string>Segoe UI</string>
  </test>
  <edit binding="same" mode="assign" name="family">
   <string>sans-serif</string>
  </edit>
 </match>
 <match target="pattern">
  <test name="family" qual="any">
   <string>PingFang SC</string>
  </test>
  <edit binding="same" mode="assign" name="family">
   <string>sans-serif</string>
  </edit>
 </match>
 <match target="pattern">
  <test name="family" qual="any">
   <string>.PingFang SC</string>
  </test>
  <edit binding="same" mode="assign" name="family">
   <string>sans-serif</string>
  </edit>
 </match>
 <match target="pattern">
  <test name="family" qual="any">
   <string>SimSun</string>
  </test>
  <edit binding="same" mode="assign" name="family">
   <string>serif</string>
  </edit>
 </match>
 <match target="pattern">
  <test name="family" qual="any">
   <string>宋体</string>
  </test>
  <edit binding="same" mode="assign" name="family">
   <string>serif</string>
  </edit>
 </match>
 <!-- Normalize system-ui before expanding generic font preferences. -->
 <match target="pattern">
  <test name="family" qual="any">
   <string>system-ui</string>
  </test>
  <edit binding="same" mode="assign" name="family">
   <string>sans-serif</string>
  </edit>
 </match>
 <!-- Strong preferences keep the requested order ahead of genericfamily
      classification (Sarasa is currently classified as genericfamily=0).
      Concrete fonts requested before a generic family retain their priority. -->
 <alias binding="strong">
  <family>sans-serif</family>
  <prefer>
   <family>Inter</family>
   <family>Sarasa Gothic SC</family>
   <family>Noto Sans CJK SC</family>
   <family>Noto Sans CJK TC</family>
   <family>Noto Sans CJK JP</family>
   <family>Noto Sans CJK KR</family>
   <!-- Extended CJK fallback: keep sans-serif documents visually consistent. -->
   <family>Plangothic P1</family>
   <family>Plangothic P2</family>
   <!-- Last resort for missing ideographs and IVD support. -->
   <family>Jigmo</family>
   <family>Jigmo2</family>
   <family>Jigmo3</family>
   <family>Noto Color Emoji</family>
  </prefer>
 </alias>
 <alias binding="strong">
  <family>serif</family>
  <prefer>
   <family>Noto Serif</family>
   <family>Noto Serif CJK SC</family>
   <family>Noto Serif CJK TC</family>
   <family>Noto Serif CJK JP</family>
   <family>Noto Serif CJK KR</family>
   <!-- Jigmo is Mincho, so it preserves the style of serif documents. -->
   <family>Jigmo</family>
   <family>Jigmo2</family>
   <family>Jigmo3</family>
   <family>Plangothic P1</family>
   <family>Plangothic P2</family>
   <family>Noto Color Emoji</family>
  </prefer>
 </alias>
 <alias binding="strong">
  <family>monospace</family>
  <prefer>
   <family>Sarasa Term SC</family>
   <family>Sarasa Term TC</family>
   <family>Sarasa Term J</family>
   <family>Plangothic P1</family>
   <family>Plangothic P2</family>
   <family>Jigmo</family>
   <family>Jigmo2</family>
   <family>Jigmo3</family>
   <family>Noto Color Emoji</family>
  </prefer>
 </alias>
 <selectfont>
  <rejectfont>
   <pattern>
    <patelt name="family">
     <!-- This font is causing problem with GitHub -->
     <string>Nimbus Sans</string>
    </patelt>
   </pattern>
  </rejectfont>
 </selectfont>
 <dir>~/.local/share/fonts</dir>
 <!-- Map LXGW WenKai GB bold to LXGW ZhenKai GB -->
 <match target="pattern">
  <test name="family">
   <string>LXGW WenKai GB</string>
  </test>
  <test compare="more_eq" name="weight">
   <const>bold</const>
  </test>
  <edit binding="strong" mode="assign" name="family">
   <string>LXGW ZhenKai GB</string>
  </edit>
  <!-- Reset weight to regular to avoid synthetic bolding on ZhenKai -->
  <edit mode="assign" name="weight">
   <const>regular</const>
  </edit>
 </match>
 <match target="font">
  <edit mode="assign" name="antialias">
   <bool>true</bool>
  </edit>
 </match>
</fontconfig>
